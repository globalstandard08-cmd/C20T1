<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Reading — Passage 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        html, body { background-color: #ffffff; height: 100%; overflow-y: auto; }
        
        .top-bar { 
            background-color: #ffffff; 
            padding: 10px 26px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 1px solid #e5e5e5;
        }
        .logo { height: 55px; width: auto; }
        
        .main-grid { 
            display: flex; 
            min-height: calc(100vh - 75px - 48px);
            gap: 0;
        }
        
        .passage-pane { 
            width: calc(50% - 6px); 
            background: #ffffff; 
            overflow-y: auto; 
            padding: 25px; 
            max-height: calc(100vh - 75px - 48px); 
            position: sticky; 
            top: 75px; 
        }
        .exam-title {
            text-align: center;
            color: #1f3a5f;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1f3a5f;
        }
        .instruction { 
            background-color: #f9f9f9; 
            border-left: 3px solid #1f3a5f; 
            padding: 12px; 
            margin-bottom: 18px; 
            border-radius: 4px; 
            font-weight: 500; 
            font-size: 15px; 
            line-height: 1.6;
        }
        .passage-text { font-size: 16px; line-height: 1.7; }
        .passage-text p { margin-bottom: 14px; text-align: justify; }
        .section-letter { 
            font-weight: bold; 
            color: #1f3a5f; 
            display: inline-block; 
            min-width: 24px;
            vertical-align: top;
        }
        
        .divider {
            width: 12px;
            background-color: #e0e0e0;
            cursor: col-resize;
            flex-shrink: 0;
            position: relative;
            border-left: 1px solid #d0d0d0;
            border-right: 1px solid #d0d0d0;
        }
        .divider:hover, .divider.active { background-color: #b8b8b8; }
        .divider::after {
            content: "⋮⋮";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 10px;
            letter-spacing: -2px;
            pointer-events: none;
        }
        
        .questions-pane { 
            width: calc(50% - 6px); 
            background: #ffffff; 
            overflow-y: auto; 
            padding: 25px; 
            max-height: calc(100vh - 75px - 48px); 
            position: sticky; 
            top: 75px; 
        }
        .questions-block { 
            margin-bottom: 35px; 
            padding-bottom: 10px;
        }
        .questions-block h3 { 
            color: #1f3a5f; 
            margin-bottom: 12px; 
            font-size: 18px;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 6px;
        }
        .q-row { 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            margin: 14px 0; 
            font-size: 16px; 
            flex-wrap: nowrap;
        }
        .q-row.current { 
            background-color: #eaf1fa; 
            padding: 10px 12px; 
            border-radius: 4px;
            margin-left: -12px;
            margin-right: -12px;
        }
        .q-num { 
            font-weight: bold; 
            min-width: 32px; 
            color: #1f3a5f; 
            flex-shrink: 0;
            padding-top: 2px;
        }
        .ans-box {
            width: 44px; 
            height: 38px; 
            border: 1px solid #333; 
            border-radius: 2px;
            padding: 0 4px; 
            font-weight: bold; 
            font-size: 15px; 
            text-transform: uppercase;
            background: #fff; 
            outline: none; 
            text-align: center;
            flex-shrink: 0;
        }
        .ans-box.filled { background: #f5f8ff; border-color: #1f3a5f; }
        .input-answer {
            flex: 1; 
            min-width: 150px;
            padding: 8px 12px; 
            border: 1px solid #ddd; 
            border-radius: 4px;
            font-size: 16px; 
            background: #fff;
        }
        .input-answer:focus { outline: none; border-color: #1f3a5f; }
        .input-answer.filled { background-color: #f5f8ff; border-color: #1f3a5f; }
        
        .match-table { 
            border-collapse: collapse; 
            margin: 15px 0; 
            width: 100%;
            table-layout: fixed;
        }
        .match-table th, .match-table td { 
            border: 1px solid #ccc; 
            padding: 8px 4px; 
            text-align: center; 
            font-size: 14px; 
            vertical-align: middle;
        }
        .match-table td:first-child { 
            text-align: left; 
            padding-left: 10px; 
            width: 70%;
        }
        .match-table th { background-color: #f9f9f9; font-weight: bold; color: #1f3a5f; }
        .match-table td input { 
            width: 36px; 
            height: 32px;
            text-align: center; 
            border: 1px solid #999; 
            border-radius: 3px; 
            padding: 2px;
            font-size: 14px;
        }
        
        .highlight { 
            background-color: #ffd700; 
            padding: 1px 3px; 
            border-radius: 2px; 
            cursor: pointer; 
            display: inline; 
            color: #000; 
            position: relative; 
        }
        .note-marker { 
            position: absolute; 
            top: -8px; 
            right: -8px; 
            width: 18px; 
            height: 18px; 
            background: #1f3a5f; 
            color: white; 
            border-radius: 50%; 
            font-size: 11px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
        }
        .context-menu { 
            position: absolute; 
            background: #fff; 
            border: 1px solid #ddd; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.1); 
            z-index: 9999; 
            display: none; 
            min-width: 180px; 
        }
        .context-menu div { 
            padding: 10px 14px; 
            cursor: pointer; 
            font-size: 14px; 
            border-bottom: 1px solid #f5f5f5; 
        }
        .context-menu div:last-child { border-bottom: none; }
        .context-menu div:hover { background: #f5f5f5; }
        
        .note-box { 
            position: absolute; 
            width: 260px; 
            min-height: 80px; 
            background: #fffde7; 
            border: 1px solid #f9d423; 
            border-radius: 6px; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.1); 
            z-index: 9990; 
            display: none; 
        }
        .note-header { 
            background: #f9d423; 
            padding: 6px 10px; 
            cursor: move; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold; 
        }
        .note-close { cursor: pointer; font-size: 16px; }
        .note-textarea { 
            width: 100%; 
            min-height: 60px; 
            border: none; 
            padding: 10px; 
            font-size: 14px; 
            resize: vertical; 
            background: transparent; 
            outline: none; 
        }
        
        .bottom-nav { 
            min-height: 48px; 
            border-top: 1px solid #eee; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 8px 15px; 
            position: sticky; 
            bottom: 0; 
            background: #fff; 
            z-index: 90; 
            flex-wrap: wrap; 
            gap: 10px;
        }
        .nav-group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .part-label { font-size: 11px; color: #1f3a5f; margin: 0 6px; font-weight: 500; }
        .q-indicator {
            width: 28px; 
            height: 28px; 
            border: 1px solid #ddd; 
            background: #fff;
            text-align: center; 
            line-height: 26px; 
            font-size: 12px; 
            cursor: pointer; 
            border-radius: 3px;
            transition: all 0.15s ease;
        }
        .q-indicator.current { 
            background: #eaf1fa; 
            border-color: #1f3a5f; 
            border-width: 2px; 
            font-weight: bold; 
        }
        .q-indicator.answered { 
            background: #10b981; 
            color: #fff; 
            border-color: #10b981; 
        }
        .back-btn, .next-passage-btn, .clear-btn {
            padding: 9px 18px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-size: 14px; 
            font-weight: bold; 
            text-decoration: none;
            transition: opacity 0.2s ease;
        }
        .back-btn { background: #6b7280; color: #fff; }
        .next-passage-btn { background: #10b981; color: #fff; }
        .clear-btn { background: #ef4444; color: #fff; margin-left: 8px; }
        button:hover, a:hover { opacity: 0.9; }
        .summary-box {
            border: 1px solid #ccc; 
            padding: 18px; 
            border-radius: 4px; 
            margin: 15px 0;
            background: #fcfcfc;
        }
        .summary-box p { margin: 10px 0; line-height: 1.6; }
        .summary-box p:first-child { margin-top: 0; font-weight: bold; }
    </style>
</head>
